name: Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - manifest.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Derive release metadata
        id: meta
        run: |
          LATEST_VERSION_TAG=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          COMMIT_COUNT=$(git rev-list --count HEAD)
          if [ -n "$LATEST_VERSION_TAG" ]; then
            BASE_VERSION=$(echo "${LATEST_VERSION_TAG#v}" | awk -F '[.-]' '{ printf "%s.%s.%s", $1, ($2==""?"0":$2), ($3==""?"0":$3) }')
            COMMITS_SINCE_TAG=$(git rev-list --count "${LATEST_VERSION_TAG}..HEAD")
            if [ "$COMMITS_SINCE_TAG" -eq 0 ]; then
              VERSION="$BASE_VERSION.0"
            else
              VERSION="$BASE_VERSION.$COMMITS_SINCE_TAG"
            fi
          else
            VERSION="0.0.1.${COMMIT_COUNT}"
          fi
          if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ] || [ -z "${{ github.event.before }}" ]; then
            RANGE="${{ github.sha }}^!"
          else
            RANGE="${{ github.event.before }}..${{ github.sha }}"
          fi
          CHANGELOG=$(git log "$RANGE" --no-merges --pretty=format:"- %s" | grep -v "Co-Authored-By" || true)
          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="- ${GITHUB_SHA}"
          fi
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          ZIP_NAME="jellyfin-xtream-tuner_${VERSION}.zip"
          RELEASE_TAG="release-${VERSION}"

          {
            echo "version=${VERSION}"
            echo "zip_name=${ZIP_NAME}"
            echo "timestamp=${TIMESTAMP}"
            echo "release_tag=${RELEASE_TAG}"
            echo "changelog<<EOF"
            printf '%s\n' "$CHANGELOG"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build plugin
        run: |
          cd Emby.Xtream.Plugin
          dotnet publish -c Release -o out --no-self-contained -p:Version=${{ steps.meta.outputs.version }}

      - name: Generate release notes
        run: |
          {
            echo "## What's Changed"
            echo ""
            printf '%s\n' "${CHANGELOG}"
            echo ""
            echo "**Commit**: https://github.com/${{ github.repository }}/commit/${{ github.sha }}"
          } > release_notes.md
        env:
          CHANGELOG: ${{ steps.meta.outputs.changelog }}

      - name: Build Jellyfin ZIP
        run: |
          VERSION=${{ steps.meta.outputs.version }}
          TIMESTAMP=${{ steps.meta.outputs.timestamp }}
          ZIP_NAME=${{ steps.meta.outputs.zip_name }}
          CHANGELOG="${CHANGELOG}"

          # Write Jellyfin meta.json
          cat > /tmp/meta.json <<EOF
          {
            "guid": "b7e3c4a1-9f2d-4e8b-a5c6-d1f0e2b3c4a5",
            "name": "Xtream Tuner",
            "description": "Xtream-compatible Live TV tuner with EPG, category filtering, and pre-populated media info.",
            "overview": "An Emby/Jellyfin Server plugin that turns any Xtream-compatible IPTV service into a full Live TV, Movies, and Series library.",
            "owner": "coreylad",
            "category": "Live TV",
            "imageUrl": "https://raw.githubusercontent.com/coreylad/emby-xtream/main/Emby.Xtream.Plugin/thumb.png",
            "version": "${VERSION}",
            "targetAbi": "10.9.0.0",
            "changelog": "${CHANGELOG}",
            "timestamp": "${TIMESTAMP}"
          }
          EOF

          # Create ZIP containing meta.json and the plugin DLL
          cd Emby.Xtream.Plugin/out
          cp /tmp/meta.json meta.json
          zip "../../${ZIP_NAME}" meta.json Emby.Xtream.Plugin.dll
          cd ../..

          CHECKSUM=$(md5sum "${ZIP_NAME}" | awk '{print $1}')
          echo "checksum=${CHECKSUM}" >> "$GITHUB_ENV"
          echo "source_url=https://github.com/${{ github.repository }}/releases/download/${{ steps.meta.outputs.release_tag }}/${ZIP_NAME}" >> "$GITHUB_ENV"
        env:
          CHANGELOG: ${{ steps.meta.outputs.changelog }}

      - name: Create release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.release_tag }}
          name: Xtream Tuner ${{ steps.meta.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: |
            Emby.Xtream.Plugin/out/Emby.Xtream.Plugin.dll
            ${{ steps.meta.outputs.zip_name }}
          body_path: release_notes.md
          draft: false

      - name: Update manifest.json
        if: github.ref == 'refs/heads/main'
        run: |
          python3 - <<'PYEOF'
          import json, os, sys

          manifest_path = "manifest.json"
          with open(manifest_path) as f:
              manifest = json.load(f)

          new_version = {
              "version":   os.environ["VERSION"],
              "changelog": os.environ["CHANGELOG"],
              "targetAbi": "10.9.0.0",
              "sourceUrl": os.environ["SOURCE_URL"],
              "checksum":  os.environ["CHECKSUM"],
              "timestamp": os.environ["TIMESTAMP"],
          }

          # Prepend new version (newest first) and remove any existing entry with same version
          plugin = manifest[0]
          plugin["versions"] = [v for v in plugin.get("versions", []) if v.get("version") != new_version["version"]]
          plugin["versions"].insert(0, new_version)

          with open(manifest_path, "w") as f:
              json.dump(manifest, f, indent=2)
              f.write("\n")
          PYEOF
        env:
          VERSION:    ${{ steps.meta.outputs.version }}
          CHANGELOG:  ${{ steps.meta.outputs.changelog }}
          SOURCE_URL: ${{ env.source_url }}
          CHECKSUM:   ${{ env.checksum }}
          TIMESTAMP:  ${{ steps.meta.outputs.timestamp }}

      - name: Commit updated manifest.json
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: update manifest.json for ${{ steps.meta.outputs.version }} [skip ci]"
          git push origin HEAD:${{ github.ref_name }}
